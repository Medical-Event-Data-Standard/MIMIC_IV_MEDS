# The complete MIMIC-IV MEDS ETL. This one file *is* the package: `sources:` says where
# the raw data comes from, `etl:` supplies the handful of run knobs, and every other
# top-level key is a raw table whose events are extracted from it. It is registered with
# `meds-extract-run` under the name `MIMIC-IV` (see this repo's `pyproject.toml`), so the
# whole ETL is one command:
#
#     meds-extract-run spec=MIMIC-IV output_dir=$MEDS_OUTPUT_DIR
#
# NOTE: no top-level `_defaults.subject_id` is needed — the raw column is literally
# `subject_id`, which MEDS-Extract 0.7 reads (and casts to Int64) by default.
#
# Null components of composite codes are coalesced to 'UNK' per component (the `??`
# operator, dftly >= 0.5) to preserve the pre-0.7 behavior of rendering nulls as
# "UNK" and keeping the row; under 0.7 a bare null component drops the row instead.

# Reserved block, consumed only by `meds-extract-run` (stripped before event-table
# parsing). It carries no credentials, so unlike `sources:` it is neither redacted from
# logs nor from the config copy written into the output tree.
etl:
  # `meds-extract-run` defaults the dataset name to the registered entry-point name, so
  # this is a fallback: it is what makes the spec self-describing when it is resolved by
  # `pkg://` reference or filesystem path instead of by registered name.
  dataset_name: MIMIC-IV
  # Carried over from the pre-0.7 `ETL.yaml` stage block. That block's other entry,
  # `shard_events.infer_schema_length: 999999999`, has no successor and needs none: 0.7
  # removed the knob and always infers CSV schemas from the full file, which is exactly
  # what the huge value was emulating.
  n_subjects_per_shard: 1000

hosp/admissions:
  ed_registration:
    code: ED_REGISTRATION
    time: '$edregtime::"%Y-%m-%d %H:%M:%S"'
  ed_out:
    code: ED_OUT
    time: '$edouttime::"%Y-%m-%d %H:%M:%S"'
  admission:
    code: f"HOSPITAL_ADMISSION//{$admission_type}//{$admission_location ?? 'UNK'}"
    time: '$admittime::"%Y-%m-%d %H:%M:%S"'
    insurance: $insurance
    language: $language
    marital_status: $marital_status
    race: $race
    hadm_id: $hadm_id
  discharge:
    code: f"HOSPITAL_DISCHARGE//{$discharge_location ?? 'UNK'}"
    time: '$dischtime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
  # We omit the death event here: `deathtime` is joined into hosp/patients via that
  # table's aggregated `_table.join`, and the death event is emitted there.

hosp/diagnoses_icd:
  _table:
    join:
      hosp/admissions:
        key: hadm_id
        cols: [dischtime]
  diagnosis:
    code: 'f"DIAGNOSIS//ICD//{$icd_version}//{$icd_code}"'
    hadm_id: $hadm_id
    time: '$dischtime::"%Y-%m-%d %H:%M:%S"'
    _metadata:
      # A dftly program over the raw metadata table: `icd_version`/`icd_code` name-match
      # the code's components (join keys); `parent_codes` inlines the ICD dot
      # normalization that previously required pre-MEDS Python (ICD-9 E-codes dot after
      # position 4, other ICD-9 after 3, ICD-10 after 3; codes at or under the position
      # are left undotted).
      hosp/d_icd_diagnoses:
        icd_version: $icd_version
        icd_code: $icd_code
        description: $long_title
        parent_codes: >-
          f"ICD{$icd_version}CM/{$icd_code[0:4]}.{$icd_code[4:]}"
          if $icd_version == "9" and $icd_code[0:1] == "E" and len_chars($icd_code) > 4
          else f"ICD{$icd_version}CM/{$icd_code}"
          if $icd_version == "9" and $icd_code[0:1] == "E"
          else f"ICD{$icd_version}CM/{$icd_code[0:3]}.{$icd_code[3:]}"
          if len_chars($icd_code) > 3
          else f"ICD{$icd_version}CM/{$icd_code}"

hosp/drgcodes:
  _table:
    join:
      hosp/admissions:
        key: hadm_id
        cols: [dischtime]
  drg:
    code: f"DRG//{$drg_type}//{$drg_code}//{$description ?? 'UNK'}"
    hadm_id: $hadm_id
    time: '$dischtime::"%Y-%m-%d %H:%M:%S"'
    drg_severity: $drg_severity
    drg_mortality: $drg_mortality

hosp/emar:
  medication:
    code: f"MEDICATION//{$medication ?? 'UNK'}//{$event_txt ?? 'UNK'}"
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    emar_id: $emar_id
    emar_seq: $emar_seq

hosp/hcpcsevents:
  hcpcs:
    code: f"HCPCS//{$short_description ?? 'UNK'}"
    hadm_id: $hadm_id
    time: '$chartdate::"%Y-%m-%d"'
    _metadata:
      # These are not all CPT codes, unfortunately
      hosp/d_hcpcs:
        short_description: $short_description
        description: $long_description
        possibly_cpt_code: $code

hosp/labevents:
  lab_specimen_collected:
    code: 'f"LAB//SPECIMEN_COLLECTED//{$itemid}"'
    hadm_id: $hadm_id
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    priority: $priority
    _metadata:
      d_labitems_to_loinc:
        # The join key is sourced from the differently-named raw column via the dftly
        # dict form (the string grammar's `$name` cannot express names with spaces).
        itemid:
          column: itemid (omop_source_code)
        description: coalesce($omop_concept_name, $label)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"
  lab_result:
    code: f"LAB//RESULT//{$itemid}//{$valueuom ?? 'UNK'}"
    hadm_id: $hadm_id
    time: '$storetime::"%Y-%m-%d %H:%M:%S"'
    numeric_value: $valuenum
    text_value: $value
    priority: $priority
    _metadata:
      d_labitems_to_loinc:
        itemid:
          column: itemid (omop_source_code)
        valueuom: $valueuom
        description: coalesce($omop_concept_name, $label)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"

hosp/omr:
  omr:
    code: $result_name
    text_value: $result_value
    time: '$chartdate::"%Y-%m-%d"'

hosp/patients:
  _table:
    cols:
      year_of_birth: "($anchor_year - $anchor_age)::str"
    join:
      # Earliest per-subject in-hospital death time, via an aggregated join
      # (mmcdermott/MEDS_extract#65 / #98, on the 0.7 line). `min` over the fixed-width
      # "%Y-%m-%d %H:%M:%S" strings is chronological. This replaces the last
      # data-joining step MIMIC needed in pre-MEDS.
      hosp/admissions:
        key: subject_id
        cols: { deathtime: min }
  gender:
    code: 'f"GENDER//{$gender}"'
    time: null
  dob:
    code: MEDS_BIRTH # This is the MEDS official code for birth.
    time: "$year_of_birth::year"
  death:
    code: MEDS_DEATH # This is the MEDS official code for death.
    # `deathtime` (precise, in-hospital, joined above) takes precedence over the raw
    # date-only `dod`. The `::?` casts are lenient (null on format mismatch) so the two
    # formats coalesce cleanly; rows where both are null (living subjects) are dropped
    # by the extraction's computed-time filter.
    time: coalesce($deathtime::?"%Y-%m-%d %H:%M:%S", $dod::?"%Y-%m-%d")

hosp/pharmacy:
  medication_start:
    code: f"MEDICATION//START//{$medication ?? 'UNK'}"
    # Raw pharmacy times mix datetime and date-only formats; parse leniently with
    # each format and take the first success (dftly >= 0.1.3; mmcdermott/dftly#46).
    time: coalesce($starttime::?"%Y-%m-%d %H:%M:%S", $starttime::?"%Y-%m-%d")
    route: $route
    frequency: $frequency
    doses_per_24_hrs: $doses_per_24_hrs
    poe_id: $poe_id
  medication_stop:
    code: f"MEDICATION//STOP//{$medication ?? 'UNK'}"
    time: coalesce($stoptime::?"%Y-%m-%d %H:%M:%S", $stoptime::?"%Y-%m-%d")
    poe_id: $poe_id

hosp/procedures_icd:
  _table:
    join:
      hosp/admissions:
        key: hadm_id
        cols: [dischtime]
  procedure:
    code: 'f"PROCEDURE//ICD//{$icd_version}//{$icd_code}"'
    hadm_id: $hadm_id
    time: '$dischtime::"%Y-%m-%d %H:%M:%S"'
    _metadata:
      # ICD-9 procedure codes take a dot after position 2 (when longer); ICD-10-PCS
      # codes are never dotted. Versions other than 9/10 yield a null parent (the
      # conditional has no final else), matching the old matcher-list semantics.
      hosp/d_icd_procedures:
        icd_version: $icd_version
        icd_code: $icd_code
        description: $long_title
        parent_codes: >-
          f"ICD9Proc/{$icd_code[0:2]}.{$icd_code[2:]}"
          if $icd_version == "9" and len_chars($icd_code) > 2
          else f"ICD9Proc/{$icd_code}"
          if $icd_version == "9"
          else f"ICD10PCS/{$icd_code}"
          if $icd_version == "10"

hosp/transfers:
  transfer:
    code: f"TRANSFER_TO//{$eventtype}//{$careunit ?? 'UNK'}"
    time: '$intime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id

icu/icustays:
  icu_admission:
    code: 'f"ICU_ADMISSION//{$first_careunit}"'
    time: '$intime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    icustay_id: $stay_id
  icu_discharge:
    code: 'f"ICU_DISCHARGE//{$last_careunit}"'
    time: '$outtime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    icustay_id: $stay_id

icu/chartevents:
  event:
    code: f"LAB//{$itemid}//{$valueuom ?? 'UNK'}"
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    numeric_value: $valuenum
    text_value: $value
    hadm_id: $hadm_id
    icustay_id: $stay_id
    _metadata:
      # TODO: make this work even with missing valueuom
      #meas_chartevents_main:
      #  itemid:
      #    column: itemid (omop_source_code)
      #  description: coalesce($omop_concept_name, $label)
      #  parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"
      # TODO: I don't know if this is necessary...
      d_labitems_to_loinc:
        itemid:
          column: itemid (omop_source_code)
        valueuom: $valueuom
        description: coalesce($omop_concept_name, $label)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"

icu/procedureevents:
  start:
    code: 'f"PROCEDURE//START//{$itemid}"'
    time: '$starttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    icustay_id: $stay_id
    _metadata:
      proc_datetimeevents:
        itemid:
          column: itemid (omop_source_code)
        description: coalesce($omop_concept_name, $label)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"
      proc_itemid:
        itemid:
          column: itemid (omop_source_code)
        description: coalesce($omop_concept_name, $label)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"
  end:
    code: 'f"PROCEDURE//END//{$itemid}"'
    time: '$endtime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    icustay_id: $stay_id
    _metadata:
      proc_datetimeevents:
        itemid:
          column: itemid (omop_source_code)
        description: coalesce($omop_concept_name, $label)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"
      proc_itemid:
        itemid:
          column: itemid (omop_source_code)
        description: coalesce($omop_concept_name, $label)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"

icu/inputevents:
  input_start:
    code: 'f"INFUSION_START//{$itemid}"'
    time: '$starttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    icustay_id: $stay_id
    order_id: $orderid
    link_order_id: $linkorderid
    numeric_value: $rate
    unit: $rateuom
    ordercategorydescription: $ordercategorydescription
    _metadata:
      inputevents_to_rxnorm:
        itemid:
          column: itemid (omop_source_code)
        description: coalesce($omop_concept_name, $label)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"
  input_end:
    code: 'f"INFUSION_END//{$itemid}"'
    time: '$endtime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    icustay_id: $stay_id
    order_id: $orderid
    link_order_id: $linkorderid
    numeric_value: $amount
    ordercategorydescription: $ordercategorydescription
    statusdescription: $statusdescription
    unit: $amountuom
    _metadata:
      inputevents_to_rxnorm:
        itemid:
          column: itemid (omop_source_code)
        description: coalesce($omop_concept_name, $label)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"
  subject_weight:
    code: '"SUBJECT_WEIGHT_AT_INFUSION//KG"'
    time: '$starttime::"%Y-%m-%d %H:%M:%S"'
    numeric_value: $patientweight

icu/outputevents:
  output:
    code: f"SUBJECT_FLUID_OUTPUT//{$itemid}//{$valueuom ?? 'UNK'}"
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    icustay_id: $stay_id
    numeric_value: $value
    _metadata:
      outputevents_to_loinc:
        itemid:
          column: itemid (omop_source_code)
        valueuom: $unitname
        description: coalesce($omop_concept_name, $label)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"

# Where the raw data lives. This block is consumed by `meds-extract-download` (which
# `meds-extract-run` spawns) and is a reserved key stripped before event conversion, so
# the credential interpolations never need to be set to run the pipeline and never land
# in logs or the config copy written to the output tree.
#
# - The download CLI resolves interpolations only for the selected bucket (plus
#   `common`), so demo/CI runs never need the credential env vars below; a
#   `key=dataset` run without them fails up front with a clear missing-env-var error
#   (mmcdermott/MEDS_extract#151, fixed upstream).
# - The concept-map entries pin `sha256` because GitHub raw publishes no checksum
#   manifest: without a recorded hash, an existing file cannot be verified on re-runs
#   and the downloader (correctly) refuses to skip it. The `v2.4.0` tag is immutable,
#   so these hashes are stable. That tag is the one version here that is *not* declared
#   below: `dataset_version` names the MIMIC-IV release, while the concept maps are
#   pinned inline by URL + hash.
sources:
  # The raw release version, in mapping form because MIMIC's demo and full releases
  # genuinely differ. Reserved (never treated as a bucket), interpolatable into the
  # entries below, and stamped by `meds-extract-run` into the output's
  # `etl_metadata.dataset_version` as `<selected bucket's version>:<this package's
  # version>` — which is why no `raw_dataset_version` fallback is needed under `etl:`.
  dataset_version:
    dataset: "3.1"
    demo: "2.2"
  dataset:
    - type: physionet
      base_url: https://physionet.org/files/mimiciv/${sources.dataset_version.dataset}
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
  demo:
    - type: physionet
      base_url: https://physionet.org/files/mimic-iv-demo/${sources.dataset_version.demo}
  common:
    - type: http
      urls:
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/d_labitems_to_loinc.csv
          rel_path: d_labitems_to_loinc.csv
          sha256: f7ef583bb2669cbf8f450e1b629dd83161c1d3f2f3ebe6abd2ff8111570e86b8
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/inputevents_to_rxnorm.csv
          rel_path: inputevents_to_rxnorm.csv
          sha256: ead9fd462f1165e2615f4ec99edb759ab4b8c6333f8949731fada68066181f16
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/lab_itemid_to_loinc.csv
          rel_path: lab_itemid_to_loinc.csv
          sha256: 2e4994fa858b55cae48286728fb6ba8dde019716080e34759fbde3d604d8ce64
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/meas_chartevents_main.csv
          rel_path: meas_chartevents_main.csv
          sha256: a7a262cac30daeb18c63e124540c6a82acb6ad796af4f0ce3f2480b975fc3f28
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/meas_chartevents_value.csv
          rel_path: meas_chartevents_value.csv
          sha256: 51cd79cf9d220eef94236df8d475b270670b908e82d7c078254492474b144f30
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/numerics-summary.csv
          rel_path: numerics-summary.csv
          sha256: f663f9e418d417306b55dd0e9c47e8780f1c64547d212aad0e0d908abc977fea
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/outputevents_to_loinc.csv
          rel_path: outputevents_to_loinc.csv
          sha256: e46a7b0e1ef4debcbd283d0c0fa8a698e761b36bd710eb69be3f1a1eed7ec103
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/proc_datetimeevents.csv
          rel_path: proc_datetimeevents.csv
          sha256: ee4592ddabd7f8995943c3ac18df883034e5f9960a954e738db9f0c02e9a824e
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/proc_itemid.csv
          rel_path: proc_itemid.csv
          sha256: b77460531714501b0008f94574580dbf33724cee3de0f45186d149fe05cf04d0
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/waveforms-summary.csv
