# Multimodal module `echo`: MIMIC-IV-ECHO transthoracic echocardiogram DICOMs.
#   https://physionet.org/content/mimic-iv-echo/
#
# Composed into the multimodal spec by `MIMIC_IV_MEDS.multimodal`; not a spec on its own. It reads
# `echo/records.parquet`, which `staging.stage_echo` builds from `echo-record-list.csv`: one row
# per DICOM file of a core subject that is on disk.
#
# `echo_link` is an additional value modality column: `echo/<sha[:2]>/<sha>.dcm`, relative to the
# MEDS root. The file is the release's DICOM, unchanged (cropping, resizing etc. are the model's job).
echo/records:
  dicom:
    code: $code
    time: '$time::"%Y-%m-%d %H:%M:%S"'
    echo_link: $link
    echo_study_id: $echo_study_id
    _metadata:
      _self:
        description: >-
          'Echocardiogram DICOM file (mostly cine loops) from MIMIC-IV-ECHO, timed at its acquisition
          (echo-record-list.acquisition_datetime). echo_link is the file relative to the MEDS root;
          echo_study_id is the echo study'
