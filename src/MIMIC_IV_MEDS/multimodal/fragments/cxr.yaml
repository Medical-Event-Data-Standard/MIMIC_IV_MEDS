# Extension `mimic-iv-cxr`: MIMIC-CXR-JPG chest radiographs.
#   https://physionet.org/content/mimic-cxr-jpg/2.1.0/
#
# Composed into the multimodal spec by `MIMIC_IV_MEDS.multimodal`; not a spec on its own. It reads
# `cxr/images.parquet`, which `staging.stage_cxr` builds from `mimic-cxr-2.0.0-metadata.csv`: one
# row per image of a core subject that is on disk, timed at StudyDate + StudyTime, coded
# `CXR//IMAGE//{ViewPosition}//{PatientOrientation}` exactly as MIMIC-CXR-DB codes its images.
#
# `external_value_link` is `external_values/cxr/<sha[:2]>/<sha>.jpg`, relative to the MEDS root,
# and `external_value_encoding` is `jpeg`. The CheXpert labels are not extracted: they are mined from the report, which exists
# only after the images, and the release gives no report time.
cxr/images:
  image:
    code: $code
    time: '$time::"%Y-%m-%d %H:%M:%S"'
    external_value_link: $link
    external_value_encoding: $encoding
    cxr_study_id: $cxr_study_id
    cxr_dicom_id: $cxr_dicom_id
    _metadata:
      _self:
        description: >-
          f"Chest radiograph image, view position {$view}, patient orientation {$orientation}
          (MIMIC-CXR-JPG mimic-cxr-2.0.0-metadata ViewPosition and
          PatientOrientationCodeSequence_CodeMeaning; UNK if missing), timed at the study's StudyDate
          and StudyTime. external_value_link is the JPG relative to the MEDS root"
