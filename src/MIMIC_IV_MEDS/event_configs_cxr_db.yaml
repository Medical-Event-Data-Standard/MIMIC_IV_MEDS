    numeric_value: $valuenum
    text_value: $value
    hadm_id: $hadm_id
    icustay_id: $stay_id
    _metadata:
      # `icu/d_items` is the dictionary for chartevents itemids and ships inside MIMIC-IV
      # itself, so it covers 100% of them and needs no external map. It supplies the human
      # name; without it every one of these codes reads as a bare `LAB//220045//bpm`.
      #
      # Joining on `itemid` alone is a deliberate PARTIAL match on the code's components
      # (`itemid` and `valueuom`): the metadata broadcasts to every code sharing the itemid,
      # whatever unit it was charted in. That is what the old "TODO: make this work even
      # with missing valueuom" wanted. Keying on the unit as well is what made this block
      # useless before -- `d_items.unitname` agrees with the charted `valueuom` for only
      # 90% of (itemid, valueuom) pairs, and the disagreements are dictionary rows carrying
      # the literal string 'None'.
      icu/d_items:
        itemid: $itemid
        description: $label
      # The OMOP map adds the LOINC/SNOMED parent where it has one. Coverage is thin (~12%
      # of the itemids charted in the demo), which is why it cannot be the only source --
      # but it is the correct map for chartevents. What was here before was
      # `d_labitems_to_loinc`, the *labevents* map: its itemid space is 50xxx and
      # chartevents is 22xxxx, so it matched essentially nothing.
      meas_chartevents_main:
        itemid:
          column: itemid (omop_source_code)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"

