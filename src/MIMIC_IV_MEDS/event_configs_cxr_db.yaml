# GENERATED by scripts/build_extension_specs.py from event_configs.yaml and
# extensions/cxr_db.yaml. This is the `MIMIC-IV-CXRDB` spec. Do not edit it: change those two files
# and re-run the script.

# The complete MIMIC-IV MEDS ETL. This one file *is* the package: `sources:` says where
# the raw data comes from, `etl:` supplies the handful of run knobs, and every other
# top-level key is a raw table whose events are extracted from it. It is registered with
# `meds-extract-run` under the name `MIMIC-IV` (see this repo's `pyproject.toml`), so the
# whole ETL is one command:
#
#     meds-extract-run spec=MIMIC-IV output_dir=$MEDS_OUTPUT_DIR
#
# NOTE: no top-level `_defaults.subject_id` is needed — the raw column is literally
# `subject_id`, which MEDS-Extract 0.7 reads (and casts to Int64) by default.
#
# Null components of composite codes are coalesced to 'UNK' per component (the `??`
# operator, dftly >= 0.5) to preserve the pre-0.7 behavior of rendering nulls as
# "UNK" and keeping the row; under 0.7 a bare null component drops the row instead.

# Reserved block, consumed only by `meds-extract-run` (stripped before event-table
# parsing). It carries no credentials, so unlike `sources:` it is neither redacted from
# logs nor from the config copy written into the output tree.
etl:
  # `meds-extract-run` defaults the dataset name to the registered entry-point name, so
  # this is a fallback: it is what makes the spec self-describing when it is resolved by
  # `pkg://` reference or filesystem path instead of by registered name.
  dataset_name: MIMIC-IV-CXRDB
  # Carried over from the pre-0.7 `ETL.yaml` stage block. That block's other entry,
  # `shard_events.infer_schema_length: 999999999`, has no successor and needs none: 0.7
  # removed the knob and always infers CSV schemas from the full file, which is exactly
  # what the huge value was emulating.
  n_subjects_per_shard: 1000
  # Extension columns that dataset.json lists by role (MEDS DatasetMetadataSchema). Every
  # other extension column is listed under `other_extension_columns` automatically. There is
  # no `license` or `description_uri`: this one spec builds both the credentialed release
  # and the open demo (`dataset_key=demo`), whose licenses and PhysioNet pages differ.
  raw_source_id_columns:
    [hadm_id, icustay_id, emar_id, poe_id, order_id, link_order_id]
  code_modifier_columns: [unit]
  # After the canonical pipeline, suMEDS (a dependency of this package) enriches
  # metadata/codes.parquet with the rules registered as MIMIC-IV (sumeds_rules.yaml) and
  # records it in metadata/dataset.json. A failed enrichment (e.g. without internet access)
  # keeps codes.parquet as the ETL wrote it and does not fail the run; `suMEDS-enrich
  # OUTPUT_DIR` finishes it later. `skip_stages=[sumeds_enrich]` leaves it out of a run.
  post_stages:
    - sumeds_enrich: { rules: MIMIC-IV }

hosp/admissions:
  _table:
    cols:
      # Constants that render the two literal ED codes. MEDS-Extract attaches code metadata
      # (`_self` included) only through a code's components and rejects a `_metadata` block on
      # a literal code; the pre-existing `codes.parquet` it suggests instead is not read by
      # the standard pipeline. A constant component gives these codes something to attach
      # through without changing the data: the code strings are identical, and rows without
      # a time are still dropped. The same idiom renders MEDS_BIRTH, MEDS_DEATH and
      # SUBJECT_WEIGHT_AT_INFUSION//KG below. See "Code metadata" in the README.
      ed_registration_code: "'ED_REGISTRATION'"
      ed_out_code: "'ED_OUT'"
  # The `_self` descriptions in this file paraphrase the MIMIC-IV documentation of the
  # column each code component comes from (https://mimic.mit.edu/docs/iv/; source
  # MIT-LCP/mimic-website at 8182227, MIT), and name that column in parentheses.
  ed_registration:
    code: $ed_registration_code
    time: '$edregtime::"%Y-%m-%d %H:%M:%S"'
    _metadata:
      _self:
        description: "'Registration in the emergency department (hosp/admissions.edregtime)'"
  ed_out:
    code: $ed_out_code
    time: '$edouttime::"%Y-%m-%d %H:%M:%S"'
    _metadata:
      _self:
        description: "'Discharge from the emergency department (hosp/admissions.edouttime)'"
  admission:
    code: f"HOSPITAL_ADMISSION//{$admission_type}//{$admission_location ?? 'UNK'}"
    time: '$admittime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    _metadata:
      _self:
        description: >-
          f"Hospital admission; admission type (urgency) {$admission_type} (hosp/admissions.admission_type);
          location before arriving at the hospital: {$admission_location ?? 'UNK'} (admission_location)"
  # Nulls are deliberately not coalesced here: a missing demographic should produce no event
  # rather than an `INSURANCE//UNK` code. See "Demographics" in the README.
  insurance:
    code: f"INSURANCE//{$insurance}"
    time: '$admittime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    _metadata:
      _self:
        description: >-
          f"Insurance recorded for the hospital admission: {$insurance} (hosp/admissions.insurance)"
  language:
    code: f"LANGUAGE//{$language}"
    time: '$admittime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    _metadata:
      _self:
        description: >-
          f"Language recorded for the hospital admission: {$language} (hosp/admissions.language)"
  marital_status:
    code: f"MARITAL_STATUS//{$marital_status}"
    time: '$admittime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    _metadata:
      _self:
        description: >-
          f"Marital status recorded for the hospital admission: {$marital_status} (hosp/admissions.marital_status)"
  race:
    code: f"RACE//{$race}"
    time: '$admittime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    _metadata:
      _self:
        description: >-
          f"Race recorded for the hospital admission: {$race} (hosp/admissions.race)"
  discharge:
    code: f"HOSPITAL_DISCHARGE//{$discharge_location ?? 'UNK'}"
    time: '$dischtime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    _metadata:
      _self:
        description: >-
          f"Hospital discharge; disposition after leaving the hospital: {$discharge_location ?? 'UNK'}
          (hosp/admissions.discharge_location)"
  # We omit the death event here: `deathtime` is joined into hosp/patients via that
  # table's aggregated `_table.joins`, and the death event is emitted there.

hosp/diagnoses_icd:
  _table:
    joins:
      hosp/admissions:
        key: hadm_id
        cols: [dischtime]
  diagnosis:
    code: 'f"DIAGNOSIS//ICD//{$icd_version}//{$icd_code}"'
    hadm_id: $hadm_id
    time: '$dischtime::"%Y-%m-%d %H:%M:%S"'
    _metadata:
      # A dftly program over the raw metadata table: `icd_version`/`icd_code` name-match
      # the code's components (join keys); `parent_codes` inlines the ICD dot
      # normalization that previously required pre-MEDS Python (ICD-9 E-codes dot after
      # position 4, other ICD-9 after 3, ICD-10 after 3; codes at or under the position
      # are left undotted).
      hosp/d_icd_diagnoses:
        icd_version: $icd_version
        icd_code: $icd_code
        description: $long_title
        parent_codes: >-
          f"ICD{$icd_version}CM/{$icd_code[0:4]}.{$icd_code[4:]}"
          if $icd_version == "9" and $icd_code[0:1] == "E" and len_chars($icd_code) > 4
          else f"ICD{$icd_version}CM/{$icd_code}"
          if $icd_version == "9" and $icd_code[0:1] == "E"
          else f"ICD{$icd_version}CM/{$icd_code[0:3]}.{$icd_code[3:]}"
          if len_chars($icd_code) > 3
          else f"ICD{$icd_version}CM/{$icd_code}"

hosp/drgcodes:
  _table:
    joins:
      hosp/admissions:
        key: hadm_id
        cols: [dischtime]
  drg:
    code: f"DRG//{$drg_type}//{$drg_code}"
    hadm_id: $hadm_id
    time: '$dischtime::"%Y-%m-%d %H:%M:%S"'
    text_value: $description
    drg_severity: $drg_severity
    drg_mortality: $drg_mortality
    _metadata:
      _self:
        # `drg_code` is an Int64, so the canonical zero padding is gone: DRG 3 must render as
        # `003`. dftly has no format specifiers and `len_chars` rejects an integer, hence the
        # prefix-and-slice. `HCFA` denotes MS-DRG; see "DRG" in the README.
        parent_codes: >-
          f"{'MS-DRG' if $drg_type == 'HCFA' else 'APR-DRG'}/{f'000{$drg_code}'[-3:]}"
        # The DRG title is not used: it varies in spelling across rows of one DRG (see "DRG" in
        # the README), and `_self` would join the variants into one multi-line description.
        description: >-
          f"Diagnosis-related group {'MS-DRG' if $drg_type == 'HCFA' else 'APR-DRG' if $drg_type == 'APR' else
          $drg_type} {f'000{$drg_code}'[-3:]} assigned to the hospital admission (hosp/drgcodes, drg_type
          {$drg_type}); the DRG title is in text_value"

hosp/emar:
  _table:
    cols:
      # A constant, used only as the second half of the composite join key below.
      # MEDS-Extract materializes any `_table.cols` entry that appears in `left_on` *before*
      # applying the join, which is what makes this work.
      #
      # `prescriptions` stores one order as several rows -- `drug_type` MAIN (the drug),
      # BASE (the diluent bag, whose ndc is '0'), ADDITIVE. Joining on `pharmacy_id` alone
      # fans out: 18.7% of pharmacy_ids carry more than one row, which would inflate the
      # emar event count by ~15%, i.e. more medication administrations than occurred.
      # Restricted to MAIN the key is exactly 1:1 and the join is row-preserving.
      drug_type: "'MAIN'"
      # Only `cols` entries named in `left_on` are materialised before the join; this one
      # is not, so it is evaluated afterwards and sees the joined `ndc`. '0' is
      # prescriptions' sentinel for "no NDC on this line" (every BASE diluent row carries
      # it) and an unmatched join leaves it null -- both collapse to UNK.
      ndc_clean: "'UNK' if ($ndc ?? '0') == '0' else $ndc"
    joins:
      hosp/prescriptions:
        left_on: [pharmacy_id, drug_type]
        right_on: [pharmacy_id, drug_type]
        cols: [ndc]
  medication:
    # `ndc` is a code component because `parent_codes` lives in codes.parquet and can only
    # be produced by a `_metadata` block, which joins on the code's own components. The drug
    # name stays in the code, so it remains readable -- including when no NDC resolves and
    # this segment renders 'UNK'.
    code: f"MEDICATION//{$medication ?? 'UNK'}//{$event_txt ?? 'UNK'}//{$ndc_clean}"
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    emar_id: $emar_id
    emar_seq: $emar_seq
    _metadata:
      # The NDC is emitted as the parent verbatim. MIMIC ships no RxNorm identifier, and
      # NDC -> RxNorm needs an external vocabulary whose free subset covers only currently
      # marketed products (MIMIC spans 2008-2022, so many NDCs are retired). Downstream
      # users who want RxNorm can fan the NDC out themselves; what matters here is that the
      # NDC attached is exactly the one dispensed for this order.
      # `_self`, not `hosp/prescriptions`: the NDC is already on this frame, brought over by
      # the `_table.joins` above, so the parent is a row-wise expression over the event's own
      # prepared rows. Pointing a `_metadata` block at `prescriptions` would make
      # `extract_code_metadata` re-scan that whole table and join it against every observed
      # code -- a full-data materialization for a column we already have.
      _self:
        # The conditional deliberately has no `else`: an else-less dftly conditional yields
        # null, and null metadata attaches no parent. '0' is prescriptions' sentinel for "no
        # NDC on this line" and an unmatched join leaves `ndc` null, so both drop out rather
        # than emitting a meaningless `NDC/0`. This reproduces the old external join, where a
        # code whose segment rendered 'UNK' matched no metadata row.
        #
        # Do not write `else null` here: dftly has no null literal, and the bare word parses
        # as the *string* "null" (it warns, but the result is a wrong parent code).
        parent_codes: 'f"NDC/{$ndc}" if ($ndc ?? "0") != "0"'
        description: >-
          f"Medication administration recorded in the eMAR: {$medication ?? 'UNK'} (hosp/emar.medication);
          administration event: {$event_txt ?? 'UNK'} (emar.event_txt); NDC dispensed for the order:
          {$ndc_clean} (hosp/prescriptions.ndc, UNK if none)"

hosp/hcpcsevents:
  hcpcs:
    code: f"HCPCS//{$short_description ?? 'UNK'}"
    hadm_id: $hadm_id
    time: '$chartdate::"%Y-%m-%d"'
    _metadata:
      # These are not all CPT codes, unfortunately
      hosp/d_hcpcs:
        short_description: $short_description
        # `d_hcpcs` carries a long description only for HCPCS Level II codes. For CPT codes
        # (most of the table) MIMIC-IV distributes no description, for licensing reasons, and
        # `short_description` names only the CPT section ("Cardiovascular system"). In
        # `d_hcpcs` no short description is shared by rows with and without a long
        # description, so `coalesce` leaves every existing long description as it was.
        description: >-
          coalesce($long_description, f"Hospital procedure billing code (HCPCS/CPT); MIMIC-IV short
          description: {$short_description} (hosp/d_hcpcs; no long description is distributed)")
        possibly_cpt_code: $code

hosp/labevents:
  lab_specimen_collected:
    code: 'f"LAB//SPECIMEN_COLLECTED//{$itemid}//{$priority ?? ''UNK''}"'
    hadm_id: $hadm_id
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    _metadata:
      d_labitems_to_loinc:
        # The join key is sourced from the differently-named raw column via the dftly
        # dict form (the string grammar's `$name` cannot express names with spaces).
        itemid:
          column: itemid (omop_source_code)
        description: coalesce($omop_concept_name, $label)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"
  lab_result:
    code: f"LAB//RESULT//{$itemid}//{$valueuom ?? 'UNK'}"
    hadm_id: $hadm_id
    time: '$storetime::"%Y-%m-%d %H:%M:%S"'
    numeric_value: $valuenum
    text_value: $value
    _metadata:
      d_labitems_to_loinc:
        itemid:
          column: itemid (omop_source_code)
        # `valueuom` was a second join key here. It is a component of this event's code, so
        # producing it narrowed the match to rows whose dictionary unit equals the charted
        # unit -- true for only 84% of (itemid, valueuom) pairs. Dropping it makes this a
        # partial match on `itemid` alone, which is safe: `itemid (omop_source_code)` is
        # unique in this file (1630 rows / 1630 distinct), so there is never a second
        # candidate row that the unit would have disambiguated.
        description: coalesce($omop_concept_name, $label)
        parent_codes: f"{$omop_vocabulary_id}/{$omop_concept_code}"

hosp/omr:
  # Three blocks partition the rows through null codes: a blood-pressure string goes only to
  # the two blood-pressure blocks, everything else only to `omr`, so each shard logs three
  # "dropped N/M rows with null code" warnings for this table (expected, not a data loss).
  # The row classes are computed once in `_table.cols` so the blocks cannot drift apart.
  # See "OMR" in the README.
  _table:
    cols:
      is_number: '/^[-+]?[0-9]+(\.[0-9]+)?$/ in ($result_value ?? "")'
      bp_systolic: 'extract group 1 of /^([0-9]+(?:\.[0-9]+)?)\/[0-9]+(?:\.[0-9]+)?$/ from $result_value'
      bp_diastolic: 'extract group 1 of /^[0-9]+(?:\.[0-9]+)?\/([0-9]+(?:\.[0-9]+)?)$/ from $result_value'
  omr:
    code: '$result_name if ($bp_systolic ?? "") == ""'
    numeric_value: "$result_value::?float if $is_number"
    text_value: "$result_value if not $is_number"
    time: '$chartdate::"%Y-%m-%d"'
    _metadata:
      _self:
        description: >-
          f"Online Medical Record (OMR) observation, mostly outpatient: {$result_name} (hosp/omr.result_name);
          a numeric result is in numeric_value, any other in text_value"
  omr_systolic:
    code: 'f"{$result_name}//SYSTOLIC" if ($bp_systolic ?? "") != ""'
    numeric_value: "$bp_systolic::?float"
    time: '$chartdate::"%Y-%m-%d"'
    seq_num: $seq_num
    _metadata:
      _self:
        description: >-
          f"Online Medical Record (OMR) observation, mostly outpatient: {$result_name} (hosp/omr.result_name),
          systolic pressure, the number before the slash in hosp/omr.result_value; in numeric_value, paired
          with the DIASTOLIC event of the same day and seq_num"
  omr_diastolic:
    code: 'f"{$result_name}//DIASTOLIC" if ($bp_diastolic ?? "") != ""'
    numeric_value: "$bp_diastolic::?float"
    time: '$chartdate::"%Y-%m-%d"'
    seq_num: $seq_num
    _metadata:
      _self:
        description: >-
          f"Online Medical Record (OMR) observation, mostly outpatient: {$result_name} (hosp/omr.result_name),
          diastolic pressure, the number after the slash in hosp/omr.result_value; in numeric_value, paired
          with the SYSTOLIC event of the same day and seq_num"

hosp/patients:
  _table:
    cols:
      year_of_birth: "($anchor_year - $anchor_age)::str"
      # Constants rendering the literal MEDS codes; see `ed_registration_code` in hosp/admissions.
      meds_birth_code: "'MEDS_BIRTH'"
      meds_death_code: "'MEDS_DEATH'"
    joins:
      # Earliest per-subject in-hospital death time, via an aggregated join
      # (mmcdermott/MEDS_extract#65 / #98, on the 0.7 line). `min` over the fixed-width
      # "%Y-%m-%d %H:%M:%S" strings is chronological. This replaces the last
      # data-joining step MIMIC needed in pre-MEDS.
      hosp/admissions:
        key: subject_id
        cols: { deathtime: min }
  gender:
    code: 'f"GENDER//{$gender}"'
    time: null
    _metadata:
      _self:
        description: >-
          f"Sex of the patient: {$gender} (hosp/patients.gender, documented as genotypical sex)"
        # No `parent_codes`: the OMOP Gender tag (`Gender//F`, `Gender//M`) is an external-ontology
        # link, added by suMEDS from `sumeds_rules.yaml` (see the README).
  dob:
    code: $meds_birth_code # MEDS_BIRTH, the MEDS official code for birth.
    time: "$year_of_birth::year"
    _metadata:
      _self:
        description: >-
          'Birth (MEDS standard code). MIMIC-IV gives the year only: hosp/patients.anchor_year minus
          anchor_age, in the shifted calendar, with ages over 89 recorded as 91'
  death:
    code: $meds_death_code # MEDS_DEATH, the MEDS official code for death.
    # `deathtime` (precise, in-hospital, joined above) takes precedence over the raw
    # date-only `dod`. The `::?` casts are lenient (null on format mismatch) so the two
    # formats coalesce cleanly; rows where both are null (living subjects) are dropped
    # by the extraction's computed-time filter.
    time: coalesce($deathtime::?"%Y-%m-%d %H:%M:%S", $dod::?"%Y-%m-%d")
    _metadata:
      _self:
        description: >-
          'Death (MEDS standard code). Time is the in-hospital death time (hosp/admissions.deathtime)
          where recorded, else the date of death (hosp/patients.dod), which includes deaths up to one
          year after hospital discharge from state records'

hosp/pharmacy:
  _table:
    cols:
      # A constant, used only as the second half of the composite join key below.
      # MEDS-Extract materializes any `_table.cols` entry that appears in `left_on` *before*
      # applying the join, which is what makes this work.
      #
      # `prescriptions` stores one order as several rows -- `drug_type` MAIN (the drug),
      # BASE (the diluent bag, whose ndc is '0'), ADDITIVE. Joining on `pharmacy_id` alone
      # fans out: 18.7% of pharmacy_ids carry more than one row, which would inflate the
      # emar event count by ~15%, i.e. more medication administrations than occurred.
      # Restricted to MAIN the key is exactly 1:1 and the join is row-preserving.
      drug_type: "'MAIN'"
      # Only `cols` entries named in `left_on` are materialised before the join; this one
      # is not, so it is evaluated afterwards and sees the joined `ndc`. '0' is
      # prescriptions' sentinel for "no NDC on this line" (every BASE diluent row carries
      # it) and an unmatched join leaves it null -- both collapse to UNK.
      ndc_clean: "'UNK' if ($ndc ?? '0') == '0' else $ndc"
    joins:
      hosp/prescriptions:
        left_on: [pharmacy_id, drug_type]
        right_on: [pharmacy_id, drug_type]
        cols: [ndc]
  medication_start:
    code: f"MEDICATION//START//{$medication ?? 'UNK'}//{$ndc_clean}"
    # Raw pharmacy times mix datetime and date-only formats; parse leniently with
    # each format and take the first success (dftly >= 0.1.3; mmcdermott/dftly#46).
    time: coalesce($starttime::?"%Y-%m-%d %H:%M:%S", $starttime::?"%Y-%m-%d")
    route: $route
    frequency: $frequency
    doses_per_24_hrs: $doses_per_24_hrs
    poe_id: $poe_id
    _metadata:
      # The NDC is emitted as the parent verbatim. MIMIC ships no RxNorm identifier, and
      # NDC -> RxNorm needs an external vocabulary whose free subset covers only currently
      # marketed products (MIMIC spans 2008-2022, so many NDCs are retired). Downstream
      # users who want RxNorm can fan the NDC out themselves; what matters here is that the
      # NDC attached is exactly the one dispensed for this order.
      # `_self`, not `hosp/prescriptions`: the NDC is already on this frame, brought over by
      # the `_table.joins` above, so the parent is a row-wise expression over the event's own
      # prepared rows. Pointing a `_metadata` block at `prescriptions` would make
      # `extract_code_metadata` re-scan that whole table and join it against every observed
      # code -- a full-data materialization for a column we already have.
      _self:
        # The conditional deliberately has no `else`: an else-less dftly conditional yields
        # null, and null metadata attaches no parent. '0' is prescriptions' sentinel for "no
        # NDC on this line" and an unmatched join leaves `ndc` null, so both drop out rather
        # than emitting a meaningless `NDC/0`. This reproduces the old external join, where a
        # code whose segment rendered 'UNK' matched no metadata row.
        #
        # Do not write `else null` here: dftly has no null literal, and the bare word parses
        # as the *string* "null" (it warns, but the result is a wrong parent code).
        parent_codes: 'f"NDC/{$ndc}" if ($ndc ?? "0") != "0"'
        description: >-
          f"Start of a pharmacy medication order: {$medication ?? 'UNK'} (hosp/pharmacy.medication,
          starttime); NDC dispensed for the order: {$ndc_clean} (hosp/prescriptions.ndc, UNK if none)"
  medication_stop:
    code: f"MEDICATION//STOP//{$medication ?? 'UNK'}//{$ndc_clean}"
    time: coalesce($stoptime::?"%Y-%m-%d %H:%M:%S", $stoptime::?"%Y-%m-%d")
    poe_id: $poe_id
    _metadata:
      # The NDC is emitted as the parent verbatim. MIMIC ships no RxNorm identifier, and
      # NDC -> RxNorm needs an external vocabulary whose free subset covers only currently
      # marketed products (MIMIC spans 2008-2022, so many NDCs are retired). Downstream
      # users who want RxNorm can fan the NDC out themselves; what matters here is that the
      # NDC attached is exactly the one dispensed for this order.
      # `_self`, not `hosp/prescriptions`: the NDC is already on this frame, brought over by
      # the `_table.joins` above, so the parent is a row-wise expression over the event's own
      # prepared rows. Pointing a `_metadata` block at `prescriptions` would make
      # `extract_code_metadata` re-scan that whole table and join it against every observed
      # code -- a full-data materialization for a column we already have.
      _self:
        # The conditional deliberately has no `else`: an else-less dftly conditional yields
        # null, and null metadata attaches no parent. '0' is prescriptions' sentinel for "no
        # NDC on this line" and an unmatched join leaves `ndc` null, so both drop out rather
        # than emitting a meaningless `NDC/0`. This reproduces the old external join, where a
        # code whose segment rendered 'UNK' matched no metadata row.
        #
        # Do not write `else null` here: dftly has no null literal, and the bare word parses
        # as the *string* "null" (it warns, but the result is a wrong parent code).
        parent_codes: 'f"NDC/{$ndc}" if ($ndc ?? "0") != "0"'
        description: >-
          f"End of a pharmacy medication order: {$medication ?? 'UNK'} (hosp/pharmacy.medication,
          stoptime); NDC dispensed for the order: {$ndc_clean} (hosp/prescriptions.ndc, UNK if none)"

hosp/procedures_icd:
  _table:
    joins:
      hosp/admissions:
        key: hadm_id
        cols: [dischtime]
  procedure:
    code: 'f"PROCEDURE//ICD//{$icd_version}//{$icd_code}"'
    hadm_id: $hadm_id
    time: '$dischtime::"%Y-%m-%d %H:%M:%S"'
    _metadata:
      # ICD-9 procedure codes take a dot after position 2 (when longer); ICD-10-PCS
      # codes are never dotted. Versions other than 9/10 yield a null parent (the
      # conditional has no final else), matching the old matcher-list semantics.
      hosp/d_icd_procedures:
        icd_version: $icd_version
        icd_code: $icd_code
        description: $long_title
        parent_codes: >-
          f"ICD9Proc/{$icd_code[0:2]}.{$icd_code[2:]}"
          if $icd_version == "9" and len_chars($icd_code) > 2
          else f"ICD9Proc/{$icd_code}"
          if $icd_version == "9"
          else f"ICD10PCS/{$icd_code}"
          if $icd_version == "10"

