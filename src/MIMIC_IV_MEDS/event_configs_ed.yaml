          'Respiratory rate in breaths per minute charted during the ED stay (MIMIC-IV-ED vitalsign.resprate)'
  o2_saturation:
    code: 'f"ED//{$context}//O2_SATURATION" if ($o2sat ?? -1) >= 0'
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    ed_stay_id: $stay_id
    numeric_value: $o2sat
    _metadata:
      _self:
        parent_codes: "'LOINC/59408-5'"
        description: >-
          'Oxygen saturation by pulse oximetry in percent charted during the ED stay (MIMIC-IV-ED vitalsign.o2sat)'
  bp_systolic:
    code: 'f"ED//{$context}//BP_SYSTOLIC" if ($sbp ?? -1) >= 0'
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    ed_stay_id: $stay_id
    numeric_value: $sbp
    _metadata:
      _self:
        parent_codes: "'LOINC/8480-6'"
        description: >-
          'Systolic blood pressure in mmHg charted during the ED stay (MIMIC-IV-ED vitalsign.sbp)'
  bp_diastolic:
    code: 'f"ED//{$context}//BP_DIASTOLIC" if ($dbp ?? -1) >= 0'
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    ed_stay_id: $stay_id
    numeric_value: $dbp
    _metadata:
      _self:
        parent_codes: "'LOINC/8462-4'"
        description: >-
          'Diastolic blood pressure in mmHg charted during the ED stay (MIMIC-IV-ED vitalsign.dbp)'
  pain:
    code: 'f"ED//{$context}//PAIN" if ($pain ?? "") != ""'
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    ed_stay_id: $stay_id
    numeric_value: "$pain_number::?float"
    text_value: '$pain if ($pain_number ?? "") == ""'
    _metadata:
      _self:
        parent_codes: "'LOINC/72514-3'"
        description: >-
          'Self-reported pain charted during the ED stay (MIMIC-IV-ED vitalsign.pain): a 0-10 score in
          numeric_value, or the entry as written in text_value when it is not a number'
  rhythm:
    code: 'f"ED//{$context}//RHYTHM" if ($rhythm ?? "") != ""'
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    ed_stay_id: $stay_id
    text_value: $rhythm
    _metadata:
      _self:
        description: >-
          'Heart rhythm charted during the ED stay, free text in text_value (MIMIC-IV-ED vitalsign.rhythm)'

# ED billing diagnoses, up to 9 per stay, ranked by `seq_num`. Timed at ED departure: they are
# assigned at or after it. The code mirrors the base's `DIAGNOSIS//ICD//...` under the `ED//` prefix,
# and the metadata block is the base's, so both carry the same description and ICD parent.
ed/diagnosis:
  _table:
    joins:
      ed/edstays:
        key: stay_id
        cols: [outtime, hadm_id]
  diagnosis:
    code: 'f"ED//DIAGNOSIS//ICD//{$icd_version}//{$icd_code}"'
    time: '$outtime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    ed_stay_id: $stay_id
    seq_num: $seq_num
    _metadata:
      hosp/d_icd_diagnoses:
        icd_version: $icd_version
        icd_code: $icd_code
        description: $long_title
        parent_codes: >-
          f"ICD{$icd_version}CM/{$icd_code[0:4]}.{$icd_code[4:]}"
          if $icd_version == "9" and $icd_code[0:1] == "E" and len_chars($icd_code) > 4
          else f"ICD{$icd_version}CM/{$icd_code}"
          if $icd_version == "9" and $icd_code[0:1] == "E"
          else f"ICD{$icd_version}CM/{$icd_code[0:3]}.{$icd_code[3:]}"
          if len_chars($icd_code) > 3
          else f"ICD{$icd_version}CM/{$icd_code}"

# Medication reconciliation: what the patient was taking before the visit, documented at `charttime`.
# One row per (medication, ETC class); `etc_rn == 1` keeps one event per medication. The code
# follows `hosp/pharmacy`'s `MEDICATION//START//{name}//{ndc}`: the name keeps it readable and the
# NDC carries the `NDC/` parent. The NDC is stored as an integer, so its leading zeros are restored
# (NDCs are 11 digits); 0 means none and renders UNK.
ed/medrecon:
  _table:
    joins:
      ed/edstays:
        key: stay_id
        cols: [hadm_id]
    cols:
      ndc_clean: "'UNK' if ($ndc ?? 0) == 0 else f'00000000000{$ndc}'[-11:]"
  medication:
    code: 'f"ED//MEDRECON//{$name}//{$ndc_clean}" if $etc_rn == 1'
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    ed_stay_id: $stay_id
    gsn: "$gsn if ($gsn ?? 0) != 0"
    _metadata:
      _self:
        parent_codes: 'f"NDC/{$ndc_clean}" if $ndc_clean != "UNK"'
        description: >-
          f"Medication the patient was taking before the ED visit, from the ED medication reconciliation:
          {$name} (MIMIC-IV-ED medrecon.name); NDC {$ndc_clean} (medrecon.ndc, UNK if none)"

# Dispensations from the ED's automated dispensing cabinets. One row per (dispensation, GSN);
# `gsn_rn == 1` keeps one event per dispensation. Pyxis names come from the cabinet formulary
# (about 1.1k distinct), so the name is the code. `med_rn` numbers the dispensations of a stay and
# keeps two same-minute dispensations of one drug apart at the merge stage.
ed/pyxis:
  _table:
    joins:
      ed/edstays:
        key: stay_id
        cols: [hadm_id]
  dispensation:
    code: 'f"ED//PYXIS//{$name}" if $gsn_rn == 1'
    time: '$charttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    ed_stay_id: $stay_id
    med_rn: $med_rn
    gsn: $gsn
    _metadata:
      _self:
        description: >-
          f"Medication dispensed in the emergency department from an automated dispensing cabinet (Pyxis): {$name}
          (MIMIC-IV-ED pyxis.name)"

# Where the raw data lives. This block is consumed by `meds-extract-download` (which
# `meds-extract-run` spawns) and is a reserved key stripped before event conversion, so
# the credential interpolations never need to be set to run the pipeline and never land
# in logs or the config copy written to the output tree.
#
# - The download CLI resolves interpolations only for the selected bucket (plus
#   `common`), so demo/CI runs never need the credential env vars below; a
#   `key=dataset` run without them fails up front with a clear missing-env-var error
#   (mmcdermott/MEDS_extract#151, fixed upstream).
# - The concept-map entries pin `sha256` because GitHub raw publishes no checksum
#   manifest: without a recorded hash, an existing file cannot be verified on re-runs
#   and the downloader (correctly) refuses to skip it. The `v2.4.0` tag is immutable,
#   so these hashes are stable. That tag is the one version here that is *not* declared
#   below: `dataset_version` names the MIMIC-IV release, while the concept maps are
#   pinned inline by URL + hash.
#
# Composed from the base `sources:` and extensions/ed.yaml by the build script.
sources:
  dataset_version:
    dataset: "3.1"
    demo: "2.2"
  dataset:
    - type: physionet
      base_url: https://physionet.org/files/mimiciv/${sources.dataset_version.dataset}
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
    - type: physionet
      base_url: https://physionet.org/files/mimic-iv-ed/2.2
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
      include:
        - ed/diagnosis.csv.gz
        - ed/edstays.csv.gz
        - ed/medrecon.csv.gz
        - ed/pyxis.csv.gz
        - ed/triage.csv.gz
        - ed/vitalsign.csv.gz
  demo:
    - type: physionet
      base_url: https://physionet.org/files/mimic-iv-demo/${sources.dataset_version.demo}
    - type: physionet
      base_url: https://physionet.org/files/mimic-iv-ed-demo/2.2
      include:
        - ed/diagnosis.csv.gz
        - ed/edstays.csv.gz
        - ed/medrecon.csv.gz
        - ed/pyxis.csv.gz
        - ed/triage.csv.gz
        - ed/vitalsign.csv.gz
  common:
    - type: http
      urls:
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/d_labitems_to_loinc.csv
          rel_path: d_labitems_to_loinc.csv
          sha256: f7ef583bb2669cbf8f450e1b629dd83161c1d3f2f3ebe6abd2ff8111570e86b8
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/inputevents_to_rxnorm.csv
          rel_path: inputevents_to_rxnorm.csv
          sha256: ead9fd462f1165e2615f4ec99edb759ab4b8c6333f8949731fada68066181f16
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/lab_itemid_to_loinc.csv
          rel_path: lab_itemid_to_loinc.csv
          sha256: 2e4994fa858b55cae48286728fb6ba8dde019716080e34759fbde3d604d8ce64
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/meas_chartevents_main.csv
          rel_path: meas_chartevents_main.csv
          sha256: a7a262cac30daeb18c63e124540c6a82acb6ad796af4f0ce3f2480b975fc3f28
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/meas_chartevents_value.csv
          rel_path: meas_chartevents_value.csv
          sha256: 51cd79cf9d220eef94236df8d475b270670b908e82d7c078254492474b144f30
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/numerics-summary.csv
          rel_path: numerics-summary.csv
          sha256: f663f9e418d417306b55dd0e9c47e8780f1c64547d212aad0e0d908abc977fea
        - url: https://raw.githubusercontent.com/MIT-LCP/mimic-code/v2.4.0/mimic-iv/concepts/concept_map/outputevents_to_loinc.csv
