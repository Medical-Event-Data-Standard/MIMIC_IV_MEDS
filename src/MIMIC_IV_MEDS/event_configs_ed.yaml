    _metadata:
      _self:
        description: >-
          f"Transfer event: {'emergency department stay' if $eventtype == 'ED' or $eventtype == 'ed' else
          'admission to the hospital' if $eventtype == 'admit' else 'transfer within the hospital' if
          $eventtype == 'transfer' else 'discharge from the hospital' if $eventtype == 'discharge' else
          $eventtype} (hosp/transfers.eventtype {$eventtype}); care unit: {$careunit ?? 'UNK'}
          (transfers.careunit)"

