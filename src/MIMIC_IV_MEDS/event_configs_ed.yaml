  start:
    code: 'f"PROCEDURE//START//{$itemid}"'
    time: '$starttime::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $hadm_id
    icustay_id: $stay_id
    _metadata:
      icu/d_items:
