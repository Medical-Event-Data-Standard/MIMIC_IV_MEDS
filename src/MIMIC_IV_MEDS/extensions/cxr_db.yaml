        - url: https://raw.githubusercontent.com/Medical-Event-Data-Standard/MIMIC_IV_MEDS/7b708035edc4eb20f4cb8c143e14a02b76551c15/data/synthetic_demo/mimic-cxr-ext-mimic-cxr-db/cxr_db/radiology_jev.parquet
          rel_path: cxr_db/radiology_jev.parquet
          sha256: 222b2a1ba39561cbb2c171e184b9999a6a562fd8a867092256c95edeaddf00bb
        - url: https://raw.githubusercontent.com/Medical-Event-Data-Standard/MIMIC_IV_MEDS/7b708035edc4eb20f4cb8c143e14a02b76551c15/data/synthetic_demo/mimic-cxr-ext-mimic-cxr-db/discharge_jev.csv
          rel_path: discharge_jev.csv
