# Where the raw data lives. This block is consumed by `meds-extract-download` (which
# `meds-extract-run` spawns) and is a reserved key stripped before event conversion, so
# the credential interpolations never need to be set to run the pipeline and never land
# in logs or the config copy written to the output tree.
#
# - The download CLI resolves interpolations only for the selected bucket (plus
#   `common`), so demo/CI runs never need the credential env vars below; a
#   `key=dataset` run without them fails up front with a clear missing-env-var error
#   (mmcdermott/MEDS_extract#151, fixed upstream).
# - The concept-map entries pin `sha256` because GitHub raw publishes no checksum
#   manifest: without a recorded hash, an existing file cannot be verified on re-runs
#   and the downloader (correctly) refuses to skip it. The `v2.4.0` tag is immutable,
#   so these hashes are stable. That tag is the one version here that is *not* declared
#   below: `dataset_version` names the MIMIC-IV release, while the concept maps are
#   pinned inline by URL + hash.
#
# Composed from the base `sources:` and extensions/mne.yaml by the build script.
sources:
  dataset_version:
    dataset: "3.1"
    demo: 2.2+mne-1.0-synthetic-0.1
  dataset:
    - type: physionet
      base_url: https://physionet.org/files/mimiciv/${sources.dataset_version.dataset}
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
    - type: physionet
      base_url: https://physionet.org/files/mimic-iv-ext-note-extract/1.0
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
      include:
        - allergies.csv.gz
        - chief_complaint.csv.gz
        - discharge_condition.csv.gz
        - discharge_diagnosis.csv.gz
        - discharge_medications.csv.gz
        - major_procedures.csv.gz
        - medications_on_admission.csv.gz
