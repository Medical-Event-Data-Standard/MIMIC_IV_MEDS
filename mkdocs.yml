site_name: MIMIC-IV MEDS
site_description: >-
  A MEDS-Extract ETL that turns MIMIC-IV, and opt-in companion datasets, into the Medical Event Data
  Standard (MEDS).
# Placeholder until the Read the Docs project exists; RTD overrides it at build time.
site_url: https://mimic-iv-meds.readthedocs.io/
repo_url: https://github.com/Medical-Event-Data-Standard/MIMIC_IV_MEDS
repo_name: Medical-Event-Data-Standard/MIMIC_IV_MEDS
edit_uri: edit/main/docs/

# The navigation is NOT declared here. `mkdocs-awesome-nav` builds it from the `docs/` tree and
# the `.nav.yml` files in it: `docs/.nav.yml` orders the top level, and
# `docs/extensions/.nav.yml` lists the overview first and then globs every other page in that
# folder. A new extension page (`docs/extensions/<name>.md`) therefore appears in the nav
# without editing this file. Do not add a `nav:` key here; awesome-nav replaces it.
plugins:
  - search
  - awesome-nav

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# `--strict` turns every warning into an error; these make broken links and anchors warnings.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
