[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MIMIC-IV-MEDS"
dynamic = ["version"]
authors = [
  { name="Matthew McDermott", email="mattmcdermott8@gmail.com" },
]
description = "An ETL pipeline to extract MIMIC-IV data into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract's own floor and ceiling. Upstream narrowed to >=3.11.4,<3.14; a
# looser range here admits interpreters it cannot be installed on, and uv refuses to
# resolve at all ("the requested Python version (>=3.11) does not satisfy Python>=3.11.4,<3.14").
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# This package ships no Python: the whole ETL is `configs/event_configs.yaml`, run by
# MEDS-Extract's own `meds-extract-run`. So there is exactly one dependency — the
# `[download]` extra adds `meds-extract-download` (httpx + tenacity), which the runner
# spawns to stage the raw data. MEDS-transforms, polars and hydra all arrive through it
# at the versions it fences; duplicating those pins here would only create drift.
#
# INTERIM (0.7 migration, see #58): MEDS-Extract 0.7.0 is not released yet, so
# `meds-extract` resolves from the upstream `dev` branch via [tool.uv.sources] below.
# Git builds of that branch self-identify as `0.6.3.devN`, so the specifier here must
# admit dev pre-releases; switch to `meds-extract[download]>=0.7.0,<0.8` and drop the
# git source once 0.7.0 is on PyPI.
dependencies = [
    "meds-extract[download]>=0.6.2.dev0,<0.8",
]

[tool.uv.sources]
meds-extract = { git = "https://github.com/mmcdermott/MEDS_extract", branch = "dev" }

[dependency-groups]
# `shfmt-py` bundles the `shfmt` binary that the `mdformat-shfmt` pre-commit
# hook shells out to; declaring it here (in addition to pinning it under the
# mdformat hook's `additional_dependencies`) keeps local + CI behavior in lock
# step instead of silently falling back to whatever `shfmt` is on the system.
# `pytest-rerunfailures` lets CI auto-retry the e2e demo download test on the
# narrow set of network exceptions seen coming out of PhysioNet (connection
# reset / IncompleteRead mid-stream) instead of turning a bad upstream minute
# into a failed CI build.
dev = [
    "pre-commit~=3.8",
    "ruff>=0.11,<1.0",
    "pytest~=9.0",
    "pytest-rerunfailures==16.1",
    "shfmt-py==3.12.0.2",
    # The test suite reads the shipped MESSY config as raw OmegaConf. It arrives through
    # `meds-extract` too, but the tests import it by name, so it is declared here.
    "omegaconf~=2.3",
]

[tool.setuptools_scm]

# Parallelism is a property of the *pipeline run*, not of this config package: the
# launchers live in MEDS-transforms, and are selected via a `parallelize:` block in the
# pipeline config (see "Parallel and multi-node runs" in the README). These extras just
# forward to MEDS-transforms' own launcher extras so `pip install MIMIC_IV_MEDS[...]`
# keeps working as the way to get them.
[project.optional-dependencies]
local_parallelism = ["meds-transforms[local-parallelism]"]
slurm_parallelism = ["meds-transforms[slurm-parallelism]"]

# Registers this dataset with `meds-extract-run`, pointing directly at the bundled MESSY
# config: `meds-extract-run spec=MIMIC-IV ...` resolves the name through this group to
# `importlib.resources.files("MIMIC_IV_MEDS.configs") / "event_configs.yaml"`. The entry
# point is never imported — its value string is parsed — and the providing distribution
# (this one) supplies the ETL version stamped into `etl_metadata.dataset_version`.
[project.entry-points."MEDS_extract.pipelines"]
MIMIC-IV = "MIMIC_IV_MEDS.configs:event_configs.yaml"

[project.urls]
Homepage = "https://github.com/Medical-Event-Data-Standard/MIMIC_IV_MEDS"
Issues = "https://github.com/Medical-Event-Data-Standard/MIMIC_IV_MEDS/issues"

# No coverage configuration: this package ships no Python to measure. The ETL's own
# coverage lives upstream in MEDS-Extract; what our tests assert is that the shipped
# config is valid, complete, and produces a correct cohort end-to-end.

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary operator suggestions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
