[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MIMIC-IV-MEDS"
dynamic = ["version"]
authors = [
  { name="Matthew McDermott", email="mattmcdermott8@gmail.com" },
]
description = "An ETL pipeline to extract MIMIC-IV data into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract's own floor and ceiling. Upstream narrowed to >=3.11.4,<3.14; a
# looser range here admits interpreters it cannot be installed on, and uv refuses to
# resolve at all ("the requested Python version (>=3.11) does not satisfy Python>=3.11.4,<3.14").
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# The ETL is `event_configs.yaml` (plus the opt-in extension specs), run by MEDS-Extract's own
# `meds-extract-run`. The only Python is the `mimic-iv-meds-multimodal` command
# (MIMIC_IV_MEDS.multimodal), which combines MIMIC-IV with any set of extensions, and
# `MIMIC_IV_MEDS.prepare_cxr_db`, which converts the semicolon-delimited MIMIC-CXR-DB release to
# parquet; both need nothing beyond what MEDS-Extract brings (polars, pyyaml). The `[download]` extra adds
# `meds-extract-download` (httpx + tenacity), which the runner spawns to stage the raw
# data. MEDS-transforms, polars and hydra all arrive through it at the versions it fences;
# duplicating those pins here would only create drift.
#
# The floor is 0.8.1: this config names its joins `_table.joins`, which 0.8 renamed from
# `_table.join` (and rejects the old name), and 0.8.1 runs the `etl.post_stages` it declares
# and writes the dataset.json fields of its `etl:` block. It also relies on `_self` metadata
# blocks and composite join keys from 0.7. MEDS-Extract 0.x minors are breaking (MESSY
# syntax, runner CLI), so the ceiling is raised deliberately when migrating.
#
# suMEDS 0.6.2 registers the `sumeds_enrich` stage that the config declares as a post-stage,
# which enriches the code metadata with the rules registered below. A failed enrichment is a
# warning that keeps the ETL output, and `metadata/dataset.json` records whether the build was
# enriched. 0.6 writes the `*_names` columns as code-to-name maps. 0.6.3 summarizes code metadata
# keyed by `code` alone, as MEDS-Extract writes it, although the config declares `unit` as a code
# modifier (0.6.2 fails with `unable to find column "unit"`). It is capped below the next
# minor for the same reason (its rules format and CLI are still 0.x).
dependencies = [
    "meds-extract[download]>=0.8.1,<0.9",
    "sumeds>=0.6.3,<0.7",
]

[dependency-groups]
# `shfmt-py` bundles the `shfmt` binary that the `mdformat-shfmt` pre-commit
# hook shells out to; declaring it here (in addition to pinning it under the
# mdformat hook's `additional_dependencies`) keeps local + CI behavior in lock
# step instead of silently falling back to whatever `shfmt` is on the system.
# `pytest-rerunfailures` lets CI auto-retry the e2e demo download test on the
# narrow set of network exceptions seen coming out of PhysioNet (connection
# reset / IncompleteRead mid-stream) instead of turning a bad upstream minute
# into a failed CI build.
dev = [
    "pre-commit~=3.8",
    "ruff>=0.11,<1.0",
    "pytest~=9.0",
    "pytest-rerunfailures==16.1",
    "shfmt-py==3.12.0.2",
]
# The documentation site (`zensical.toml`, `docs/`), built with Zensical, the successor to
# Material for MkDocs: by Read the Docs from `.readthedocs.yaml`, and in CI with
# `zensical build --strict`. Preview locally with `uv run --group docs zensical serve`.
# Zensical's built-in awesome-nav support builds the navigation from the `.nav.yml` files in
# `docs/`, so a new page under `docs/extensions/` appears without a config edit. Zensical is 0.x,
# so the ceiling is raised deliberately.
docs = [
    "zensical>=0.1.1,<0.2",
]

[project.scripts]
# MIMIC-IV plus any combination of MIMIC-IV-ED, -Note, -ECG, -ECHO and MIMIC-CXR-JPG, from local
# copies of the releases, with the ECG/echo/CXR objects stored inside the MEDS root. See
# src/MIMIC_IV_MEDS/multimodal/cli.py.
mimic-iv-meds-multimodal = "MIMIC_IV_MEDS.multimodal.cli:main"

[tool.setuptools_scm]

[project.entry-points."MEDS_extract.pipelines"]
MIMIC-IV = "MIMIC_IV_MEDS:event_configs.yaml"
# MIMIC-IV plus the separately-credentialed MIMIC-Note-Extract tables. Generated from the base
# and `extensions/mne.yaml` by `scripts/build_extension_specs.py`; see the README.
MIMIC-IV-MNE = "MIMIC_IV_MEDS:event_configs_mne.yaml"
# MIMIC-IV plus the separately-credentialed MIMIC-IV-ED tables (the demo works too: it adds the
# public MIMIC-IV-ED demo). Generated from the base and `extensions/ed.yaml`; see docs/extensions/ed.md.
MIMIC-IV-ED = "MIMIC_IV_MEDS:event_configs_ed.yaml"
# MIMIC-IV plus MIMIC-CXR-DB's radiographs, CheXpert labels and note concepts, from
# `extensions/cxr_db.yaml`. Its download needs `python -m MIMIC_IV_MEDS.prepare_cxr_db` before the run;
# see docs/extensions/cxr-db.md.
MIMIC-IV-CXRDB = "MIMIC_IV_MEDS:event_configs_cxr_db.yaml"

# Registers the suMEDS rules under the same name, so the config's `sumeds_enrich: {rules: MIMIC-IV}`
# and `--rules MIMIC-IV` find them.
[project.entry-points."sumeds.rules"]
MIMIC-IV = "MIMIC_IV_MEDS:sumeds_rules.yaml"

[project.urls]
Homepage = "https://github.com/Medical-Event-Data-Standard/MIMIC_IV_MEDS"
Issues = "https://github.com/Medical-Event-Data-Standard/MIMIC_IV_MEDS/issues"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary operator suggestions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
