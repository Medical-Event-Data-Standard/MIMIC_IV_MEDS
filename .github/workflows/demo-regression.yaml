name: Demo summary-stats regression

# Builds the public MIMIC-IV demo cohort and compares its summary-stats fingerprint against
# the baseline committed at tests/regression/demo_summary_stats.json.
#
# The demo release is pinned in the MESSY config, so the raw input does not move between
# runs: any change in the fingerprint is a change this repo made. That is what makes a
# committed baseline meaningful here.
#
# Non-blocking to start with (`fail-on: never` in tests/regression/policy.yaml) -- a
# divergence is surfaced as a ::warning:: and in the job summary rather than failing the
# build. Promote the policy's `fail_on` to `error` once a few PRs have shown the signal is
# clean. Regenerate the baseline deliberately, never as a drive-by:
#
#   meds-extract-run spec=MIMIC-IV output_dir=$OUT download_key=demo
#   extract_MEDS_summary_stats $OUT -o tests/regression/demo_summary_stats.json
#
# The action, the package-spec, and the committed baseline are pinned together on
# meds_summary_stats 0.0.2 (stats_schema_version 1) and must move together: comparison
# refuses to diff across schema versions, so bumping one without the others fails the job
# with a precondition error rather than a useful diff.
#
# There is a bump waiting. meds_summary_stats#7 fixes two defects that matter here: presence
# counters that counted null-filled `parent_codes` as coverage (which made 0.7's metadata fix
# read as a 102-mapping regression) and column lists compared positionally (one added column
# produced ~20 spurious errors). It bumps the schema to 2. When it lands and releases, bump
# both pins below and regenerate the baseline in the same commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: "3.12"

      - name: Build the demo MEDS cohort
        env:
          OUT: ${{ runner.temp }}/mimic_demo_meds
        run: |
          set -euo pipefail
          # The demo release is fully open, so no PhysioNet credentials are needed.
          uv run meds-extract-run spec=MIMIC-IV output_dir="$OUT" download_key=demo

      - name: Summary-stats regression check
        id: stats
        uses: Medical-Event-Data-Standard/meds_summary_stats@0.0.2
        with:
          meds-dir: ${{ runner.temp }}/mimic_demo_meds
          baseline: tests/regression/demo_summary_stats.json
          policy: tests/regression/policy.yaml
          package-spec: meds_summary_stats==0.0.2
          # `fail-on` is deliberately left to the policy file so there is exactly one
          # place that decides how strict this check is.
          upload-artifacts: "true"
          artifact-name: mimic-demo-summary-stats

      - name: Warn on divergence
        if: ${{ steps.stats.outputs.status != '' && steps.stats.outputs.status != 'pass' }}
        env:
          STATUS: ${{ steps.stats.outputs.status }}
        run: |
          echo "::warning title=Demo cohort fingerprint changed::" \
               "meds_summary_stats reported '${STATUS}' against" \
               "tests/regression/demo_summary_stats.json. Review the job summary." \
               "If the change is intended, regenerate the baseline in this PR."
