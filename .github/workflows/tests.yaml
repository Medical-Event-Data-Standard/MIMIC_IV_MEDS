name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # `src/` is not passed to pytest and there is no coverage measurement:
        # this package ships no Python, only `configs/event_configs.yaml`.
        #
        # `--reruns`/`--only-rerun` (from pytest-rerunfailures) retries the
        # e2e demo-download test when PhysioNet returns transient network
        # errors. These are upstream failures, not real regressions, and
        # blocking CI on them means no PR can land during a bad PhysioNet
        # minute. The pattern is intentionally scoped to network-shaped
        # failures: anything else fails hard on first occurrence.
        #
        # The download layer is httpx (MEDS-Extract's `[download]` extra), so
        # the httpx exception names lead: RemoteProtocolError is a connection
        # dropped mid-response, ReadError/ConnectError are its transport
        # errors (note `ConnectionError` does not match `ConnectError`), and
        # ConnectTimeout/ReadTimeout/PoolTimeout are its timeout family. The
        # requests/urllib3 names are kept because the same shapes surface
        # through other dependencies' HTTP stacks.
        run: |
          uv run pytest tests/ -v \
            --junitxml=junit.xml -s \
            --reruns 3 --reruns-delay 20 \
            --only-rerun "RemoteProtocolError|ReadError|ConnectError|ConnectTimeout|ReadTimeout|PoolTimeout|IncompleteRead|ChunkedEncodingError|ConnectionError|MaxRetryError|[Cc]onnection broken"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
