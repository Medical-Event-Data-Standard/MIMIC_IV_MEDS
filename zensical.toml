# The documentation site (docs/), built with Zensical (https://zensical.org), the successor to
# Material for MkDocs. Read the Docs builds it from `.readthedocs.yaml`, and the Docs workflow runs
# `zensical build --strict`. Preview it locally with `uv run --group docs zensical serve`.
[project]
site_name = "MIMIC-IV MEDS"
site_description = "A MEDS-Extract ETL that turns MIMIC-IV, and opt-in companion datasets, into the Medical Event Data Standard (MEDS)."
# The canonical URL: RTD's default version, under the placeholder project slug. Zensical does not
# interpolate variables, so RTD cannot inject it at build time as it did for MkDocs; update it by
# hand if the RTD project's slug or default version differs. Page links are relative, so the site
# works under any version path either way.
site_url = "https://mimic-iv-meds.readthedocs.io/en/latest/"
repo_url = "https://github.com/Medical-Event-Data-Standard/MIMIC_IV_MEDS"
repo_name = "Medical-Event-Data-Standard/MIMIC_IV_MEDS"
edit_uri = "edit/main/docs/"

# The navigation is NOT declared here: do not add a `nav` key, which would override it. Zensical's
# native implementation of mkdocs-awesome-nav builds it from the `docs/` tree and the `.nav.yml`
# files in it. `docs/.nav.yml` orders the top level, and `docs/extensions/.nav.yml` lists the
# overview first and then globs every other page in that folder, so a new extension page
# (`docs/extensions/<name>.md`) appears in the nav without editing any config.
[project.plugins.awesome-nav]

# A broken link or anchor is a warning, which `zensical build --strict` turns into an error.
[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Setting this list replaces Zensical's default extensions, so it names every one the pages use.
[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
