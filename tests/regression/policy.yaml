# Comparison policy for the demo summary-stats regression check.
#
# The MIMIC-IV demo release is pinned in the MESSY config, so the raw input never moves
# between runs. Anything that changes in the fingerprint is therefore something this repo
# did, which is what makes a committed baseline meaningful and what justifies a strict
# posture: the cohort's content is an *error*, and a clean run reports nothing at all.
#
# When a PR changes the output on purpose, regenerate the baseline in that same PR:
#
#   meds-extract-run spec=MIMIC-IV output_dir=$OUT dataset_key=demo
#   extract_MEDS_summary_stats $OUT -o tests/regression/demo_summary_stats.json
#
# NOTE: the GitHub action always passes `--fail-on`, and the CLI flag overrides this file.
# The action input and this value must agree; both are `error`.
fail_on: error

# `dataset_version` here is "<MIMIC release>:<ETL version>", and the ETL version comes from
# `git describe` -- so it changes on every commit, not just when the data changes. Left at
# the default this would trip the version-change path on every PR.
on_dataset_version_change: ignore

# A key the tool no longer emits is a real signal (a stat we were watching disappeared); a
# new key is just a newer tool with more to say.
on_removed_key: error
on_added_key: warning

rules:
  # ---------------------------------------------------------------------------------
  # Errors: the semantic content of the cohort. With the input pinned, none of this can
  # move unless the ETL changed.
  # ---------------------------------------------------------------------------------

  # Volumes and the quality counters (`counts.quality.*` should sit at zero).
  - path: counts.**
    kind: exact
    on_change: error

  # The code vocabulary changed iff a digest changed.
  - path: codes.digests.**
    kind: exact
    on_change: error

  # Metadata coverage: how many codes carry a description or parent codes, and how many
  # observed codes have no metadata row at all. This is the number the 0.7 metadata work
  # moved, so it is precisely what this check exists to notice.
  - path: code_metadata.n_codes
    kind: exact
    on_change: error

  - path: code_metadata.n_data_codes_missing_from_metadata
    kind: exact
    on_change: error

  - path: code_metadata.n_with_description
    kind: exact
    on_change: error

  - path: code_metadata.n_with_parent_codes
    kind: exact
    on_change: error

  # Split assignment is deterministic given the pinned input and the configured seed.
  - path: splits.**
    kind: exact
    on_change: error

  # Two columns disagreeing on dtype across shards is a defect at any count.
  - path: layout.column_dtype_conflicts
    kind: exact
    on_change: error

  # ---------------------------------------------------------------------------------
  # Warnings: real signal, but driven by things other than this repo's config.
  # ---------------------------------------------------------------------------------

  # Byte-level digests move whenever parquet encoding does -- writer version, compression,
  # row-group boundaries -- which a dependency bump can do without any ETL change. Worth
  # seeing, not worth blocking.
  - path: dataset_digest.**
    kind: exact
    on_change: warning

  # Column lists are compared positionally upstream, so one added column fans out into
  # ~20 findings that all say the same thing:
  #   Medical-Event-Data-Standard/meds_summary_stats#6
  # Kept as warnings until that is fixed; a removed key still errors via `on_removed_key`.
  - path: layout.extra_data_columns.**
    kind: exact
    on_change: warning

  # ---------------------------------------------------------------------------------
  # Ignored: volatile by construction, so a rule here would fire on every single run and
  # teach readers that findings are noise.
  # ---------------------------------------------------------------------------------

  # `metadata/dataset.json` embeds `created_at` and the git-derived ETL version, so its
  # digest -- and the metadata-wide digest covering it -- differ between two runs over
  # byte-identical input. Verified by running the demo extraction twice.
  - path: dataset_digest.by_file.metadata/dataset\.json
    kind: ignore

  - path: dataset_digest.dataset_metadata
    kind: ignore

  - path: dataset.etl_version
    kind: ignore

  - path: dataset.dataset_version
    kind: ignore

  - path: dataset.created_at
    kind: ignore

  - path: dataset.location_uri
    kind: ignore
