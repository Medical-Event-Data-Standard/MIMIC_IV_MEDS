# Comparison policy for the demo summary-stats regression check.
#
# Starting posture is deliberately non-blocking: `fail_on: never` reports everything and
# always exits 0, which is the tool's own recommended first step for a repo that has never
# had this check. The workflow turns a non-pass verdict into a visible ::warning:: so it
# is not silent. Promote to `fail_on: error` once the noise level here is known to be zero
# across a few real PRs.
fail_on: never

# `dataset_version` on this ETL is "<MIMIC release>:<ETL version>", and the ETL version is
# derived from git describe -- so it changes on *every commit*, not just when the data
# changes. Comparing against a committed baseline would therefore trip the version-change
# path on every single PR. The MIMIC demo release is pinned in the config, so the data
# genuinely is not moving underneath us.
on_dataset_version_change: ignore

on_removed_key: error
on_added_key: warning

rules:
  # ---------------------------------------------------------------------------------
  # The checks that actually matter for this ETL: the demo release is fixed, so any
  # movement in volume is an ETL change and should be looked at.
  # ---------------------------------------------------------------------------------
  - path: counts.n_subjects
    kind: exact
    on_change: error

  - path: counts.n_measurements
    kind: exact
    on_change: error

  - path: counts.n_events
    kind: exact
    on_change: error

  - path: counts.n_unique_codes
    kind: exact
    on_change: error

  # Should never leave zero regardless of what the ETL does.
  - path: counts.quality.**
    kind: absolute
    error: 0

  - path: code_metadata.n_data_codes_missing_from_metadata
    kind: absolute
    error: 0

  # The code set changed iff this digest changed.
  - path: codes.digests.alphabetical
    kind: exact
    on_change: error

  # ---------------------------------------------------------------------------------
  # Ignored: volatile provenance that moves on every run or every commit.
  # ---------------------------------------------------------------------------------
  - path: dataset.etl_version
    kind: ignore

  - path: dataset.dataset_version
    kind: ignore

  - path: dataset.created_at
    kind: ignore

  - path: dataset.location_uri
    kind: ignore

  # Byte-level digests move whenever parquet encoding does (writer version, compression,
  # row-group boundaries), which is not an ETL regression. Left as warnings so a change is
  # still visible in the report.
  - path: dataset_digest.**
    kind: exact
    on_change: warning

  # Column lists are currently compared positionally upstream, so a single added column
  # fans out into ~20 findings that all say the same thing:
  #   Medical-Event-Data-Standard/meds_summary_stats#6
  # Kept as warnings until that is fixed; `layout.**` removals still surface.
  - path: layout.extra_data_columns.**
    kind: exact
    on_change: warning
